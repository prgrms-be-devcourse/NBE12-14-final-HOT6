<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif">
<rect width="680" height="340" fill="#ffffff"/>
<text x="70" y="30" font-size="16" font-weight="600" fill="#1f2430">A. 보호 장치를 하나씩 뺐을 때 — 정상값의 몇 배가 되었나</text>
<line x1="200.0" x2="200.0" y1="56" y2="284" stroke="#e5e7eb"/>
<text x="200.0" y="302.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">0배</text>
<line x1="275.0" x2="275.0" y1="56" y2="284" stroke="#e5e7eb"/>
<text x="275.0" y="302.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">3배</text>
<line x1="350.0" x2="350.0" y1="56" y2="284" stroke="#e5e7eb"/>
<text x="350.0" y="302.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">6배</text>
<line x1="425.0" x2="425.0" y1="56" y2="284" stroke="#e5e7eb"/>
<text x="425.0" y="302.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">9배</text>
<line x1="500.0" x2="500.0" y1="56" y2="284" stroke="#e5e7eb"/>
<text x="500.0" y="302.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">12배</text>
<line x1="575.0" x2="575.0" y1="56" y2="284" stroke="#e5e7eb"/>
<text x="575.0" y="302.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">15배</text>
<line x1="650.0" x2="650.0" y1="56" y2="284" stroke="#e5e7eb"/>
<text x="650.0" y="302.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">18배</text>
<text x="190.0" y="88.5" font-size="12" fill="#1f2430" text-anchor="end" font-weight="400">유니크 제약 제거 (S1)</text>
<rect x="200" y="73.5" width="400.0" height="22" rx="3" fill="#ea580c"/>
<text x="592.0" y="88.5" font-size="11" fill="#ffffff" text-anchor="end" font-weight="600">같은 키로 결제 행 16개 (정상 1)</text>
<text x="190.0" y="145.5" font-size="12" fill="#1f2430" text-anchor="end" font-weight="400">QR 조건부 UPDATE 제거 (S2)</text>
<rect x="200" y="130.5" width="250.0" height="22" rx="3" fill="#ea580c"/>
<text x="442.0" y="145.5" font-size="11" fill="#ffffff" text-anchor="end" font-weight="600">QR 1개로 10번 결제 (정상 1)</text>
<text x="190.0" y="202.5" font-size="12" fill="#1f2430" text-anchor="end" font-weight="400">지갑 락 제거 (S3)</text>
<rect x="200" y="187.5" width="50.0" height="22" rx="3" fill="#ea580c"/>
<text x="258.0" y="202.5" font-size="11" fill="#1f2430" text-anchor="start" font-weight="400">50건 완료 (정상 25), 잔액이 남음</text>
<text x="190.0" y="259.5" font-size="12" fill="#1f2430" text-anchor="end" font-weight="400">결제 락 제거 (S4)</text>
<rect x="200" y="244.5" width="25.0" height="22" rx="3" fill="#9ca3af"/>
<text x="233.0" y="259.5" font-size="11" fill="#1f2430" text-anchor="start" font-weight="400">환급 1번 (정상 1), 깨지지 않음</text>
<line x1="225.0" x2="225.0" y1="50" y2="284" stroke="#1f2430" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="229.0" y="48.0" font-size="11" fill="#1f2430" text-anchor="start" font-weight="400">정상(1배)</text>
<text x="340.0" y="330.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">50스레드 × 3라운드 중 가장 나쁜 라운드</text>
