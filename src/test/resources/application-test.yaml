# 테스트 전용 설정. 개발 DB(devpay)와 분리된 devpay_test 를 사용한다.
# 접속 주소를 반드시 명시한다. create-drop 이 개발 DB 에 적용되지 않게 하기 위해서다.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/devpay_test
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false

# 테스트 전용 JWT 서명 키(32바이트 이상). 운영 키와 무관하다.
jwt:
  secret: test-only-jwt-secret-key-0123456789-abcdef

# 테스트에서는 실제 네이버를 호출하지 않는다. 개발 PC 의 .env 에 키가 있어도 비워서, 주소 변환이 건너뛰어지고(위치 없이 저장) 외부 호출이 나가지 않게 한다.
naver:
  map:
    client-id: ""
    client-secret: ""

# 테스트에서는 스케줄러를 끄고 배치 메서드를 직접 호출한다.
cashback:
  scheduler:
    enabled: false
  # 시작할 때 연 예산을 자동으로 넣지 않는다(예산이 없는 상태를 전제로 하는 테스트가 있다).
  init:
    enabled: false
