spring:
  application:
    name: NBE12-14-final-HOT6
  config:
    # 프로젝트 폴더의 .env(커밋하지 않는 파일)를 읽는다. 로컬에서 JWT_SECRET 같은 값을 한 번 적어 두면 되고,
    # 파일이 없으면(운영 등) 건너뛰므로 운영은 환경 변수를 그대로 쓴다.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/devpay
    username: devpay
    password: ${DB_PASSWORD:devpay1234}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# JWT. 서명 키는 기본값을 두지 않는다. 환경 변수 JWT_SECRET(32바이트 이상)이 없으면 시작할 때 실패한다.
# 저장소에 공개된 기본 키가 있으면 설정을 빠뜨린 서버가 그 키로 서명한 토큰(예: 운영자)을 믿게 되기 때문이다.
# 테스트용 키는 application-test.yaml 에 둔다.
jwt:
  secret: ${JWT_SECRET}
  access-token-minutes: 30

# API 명세(Swagger UI): /swagger-ui.html. 운영 환경에서는 application-prod.yaml 에서 끈다.
springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
    persist-authorization: true # 새로고침해도 Authorize 에 넣은 토큰을 유지한다
    groups-order: asc
  default-produces-media-type: application/json

# 서버가 시작할 때 올해 연 예산이 없으면 이 금액으로 한 번 만든다(이미 있으면 건드리지 않는다).
# 월 예산은 운영자가 정책·예산 화면에서 배정한다. 테스트는 application-test.yaml 에서 끈다.
cashback:
  init:
    enabled: true
    annual-budget: 100000000
