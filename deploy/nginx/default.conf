server {
    listen 80;
    server_name _;

    # certbot 이 80번 포트로 도메인 소유를 확인하는 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name devpay-team06.duckdns.org;

    # TODO: 최종 도메인이 정해지면 server_name 과 인증서 경로의 도메인을 바꾼다.
    ssl_certificate /etc/letsencrypt/live/devpay-team06.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devpay-team06.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://backend:8080;
    }

    location /swagger-ui/ {
        proxy_pass http://backend:8080;
    }

    location = /swagger-ui.html {
        proxy_pass http://backend:8080;
    }

    location /v3/api-docs {
        proxy_pass http://backend:8080;
    }

    location = /actuator/health {
        proxy_pass http://backend:8080;
    }

    location / {
        proxy_pass http://frontend:3000;
    }
}
