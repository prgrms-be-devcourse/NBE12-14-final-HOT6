server {
    listen 80;
    server_name _;

    # certbot 이 80번 포트로 도메인 소유를 확인하는 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name devpay-team06.duckdns.org;

    # TODO: 최종 도메인이 정해지면 server_name 과 인증서 경로의 도메인을 바꾼다.
    ssl_certificate /etc/letsencrypt/live/devpay-team06.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devpay-team06.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 보안 헤더. always 를 붙여 오류 응답에도 싣는다.
    # 백엔드(Spring Security)가 같은 헤더를 보내면 값이 두 번 실리므로, 전달받은 쪽은 숨기고 nginx 것만 남긴다.
    # HSTS 는 한 번 받은 브라우저가 이 도메인에 HTTPS 로만 접속하게 한다(1년).
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 운영 환경에서는 API 명세를 공개하지 않는다.
    # 프론트의 /v3/api-docs 전달(next.config.ts)로도 우회되지 않도록 함께 막는다.
    location ^~ /v3/ {
        return 404;
    }

    location ^~ /swagger-ui {
        return 404;
    }

    location /api/ {
        proxy_pass http://backend:8080;
    }

    location = /actuator/health {
        proxy_pass http://backend:8080;
    }

    # 개발용 화면은 배포 사이트에서 사용하지 않는다.
    location = /dev {
        return 404;
    }

    location ^~ /dev/ {
        return 404;
    }

    location / {
        proxy_pass http://frontend:3000;
    }
}
